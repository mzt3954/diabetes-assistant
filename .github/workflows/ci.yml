name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # 1. 静态检查 + 单元/冒烟测试 + Dify 联调测试
  #    这一组不需要浏览器，跑得快，是最先失败的关卡
  # ------------------------------------------------------------------
  unit:
    name: Lint & Unit / Smoke / Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: 单元测试（logic-test）
        run: npm run test:logic

      - name: 冒烟测试（smoke-test，13 个页面）
        run: npm run test:smoke

      - name: Dify 联调测试（真实 HTTP + SSE）
        run: npm run test:integration

  # ------------------------------------------------------------------
  # 2. 端到端测试（需要下载 Chromium，单独一个 job）
  #    仅当 unit 通过后才跑，避免浪费浏览器下载时间
  # ------------------------------------------------------------------
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npx playwright test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/report/
          retention-days: 7
