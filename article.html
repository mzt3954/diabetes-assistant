<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>科普文章 - 糖尿病预治智能助手</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <nav id="dpaNavbar"></nav>

  <main class="page">
    <header class="article-hero">
      <div class="container">
        <h1 id="articleTitle">加载中...</h1>
        <div class="article-hero-meta" id="articleMeta"></div>
      </div>
    </header>

    <div class="container">
      <article class="article-body" id="articleBody"></article>

      <div class="article-actions">
        <button class="btn btn-outline" id="collectBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span id="collectText">收藏</span>
        </button>
        <button class="btn btn-outline" id="backBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          返回
        </button>
      </div>

      <section class="section">
        <div class="section-header"><h2 class="section-title">相关推荐</h2></div>
        <div class="article-list" id="relatedList"></div>
      </section>
    </div>
  </main>

  <nav id="dpaBottomNav"></nav>

  <!-- 本地真实配置（不入库）：不存在时浏览器仅报 404，功能自动降级到本地引擎 -->

  <script src="js/config.js" defer></script>
  <script src="js/crypto.js" defer></script>
  <script src="js/seed.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/ui.js" defer></script>

</body>
</html>
