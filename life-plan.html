<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生活方案 - 糖尿病预治智能助手</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <nav id="dpaNavbar" class="navbar" aria-label="主导航">
    <div class="container">
      <div class="flex items-center justify-between">
        <a href="home.html" class="navbar-brand" aria-label="返回首页">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
          <span>糖尿病助手</span>
        </a>
        <button class="theme-toggle" id="dpaThemeToggle" aria-label="切换明暗主题" title="切换主题">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <main class="page">
    <header class="page-header">
      <div class="container">
        <div class="flex items-center gap-sm mb-xs">
          <span class="tag tag-secondary">个性化</span>
          <span class="text-sm text-muted">饮食 · 运动 · 生活习惯</span>
        </div>
        <h1 class="page-title">我的生活方案</h1>
        <p class="page-subtitle" id="planSubtitle">基于您的健康信息生成的个性化饮食与运动方案</p>
      </div>
    </header>

    <div class="container">
      <!-- 离线提示 -->
      <div id="offlineBadge" class="hidden" role="status" aria-live="polite">
        <div class="disclaimer mb-md" style="background:var(--info-soft);border-color:var(--info-light);color:var(--info-dark);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          <span>当前为离线演示模式，方案由本地智能引擎生成。</span>
        </div>
      </div>

      <!-- 空状态 -->
      <div id="emptyArea" class="hidden">
        <div class="empty-state card">
          <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <div class="empty-state-title">暂无生活方案</div>
          <div class="empty-state-desc">首次使用需要生成您的专属方案，AI 将结合健康档案为您定制。</div>
          <button class="btn btn-primary mt-md" id="generatePlanBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
            <span class="btn-text">生成方案</span>
            <span class="loading-spinner hidden" style="width:16px;height:16px;border-width:2px" aria-hidden="true"></span>
          </button>
        </div>
      </div>

      <!-- 方案区 -->
      <div id="planArea" class="hidden">
        <div class="plan-stats" id="planStats">
          <div class="plan-stat">
            <div class="plan-stat-value" id="statTotal">0</div>
            <div class="plan-stat-label">今日计划</div>
          </div>
          <div class="plan-stat">
            <div class="plan-stat-value" id="statDone">0</div>
            <div class="plan-stat-label">已完成</div>
          </div>
          <div class="plan-stat">
            <div class="plan-stat-value" id="statProgress">0%</div>
            <div class="plan-stat-label">完成率</div>
          </div>
        </div>

        <!-- 进度环形图 -->
        <div class="ring-row" id="planRings">
          <div id="planRingToday"></div>
          <div id="planRingWeek"></div>
        </div>

        <div class="plan-tabs" id="planTabs" role="tablist" aria-label="方案分类">
          <button class="plan-tab active" data-type="饮食" role="tab" aria-selected="true" aria-controls="planList">饮食方案<span class="count" id="countDiet">0</span></button>
          <button class="plan-tab" data-type="运动" role="tab" aria-selected="false" aria-controls="planList">运动方案<span class="count" id="countExercise">0</span></button>
          <button class="plan-tab" data-type="其他" role="tab" aria-selected="false" aria-controls="planList">其他建议<span class="count" id="countOther">0</span></button>
        </div>

        <div id="planList" role="tabpanel"></div>

        <!-- 错误态 -->
        <div class="error-state card hidden" id="planError" role="alert" aria-live="assertive">
          <svg class="error-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <div class="error-state-title">方案加载失败</div>
          <div class="error-state-desc">无法读取生活方案数据，请检查本地存储状态后重试。</div>
          <button class="btn btn-primary btn-sm" type="button" id="retryPlan">重新加载</button>
        </div>

        <div class="flex gap-md mt-md mb-lg">
          <button class="btn btn-outline flex-1" id="customizeBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            定制方案
          </button>
          <button class="btn btn-primary flex-1" id="checkinBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            查看打卡分析
          </button>
        </div>

        <div class="disclaimer mb-lg">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          <span>方案由 AI 结合您的健康信息生成，仅供参考。具体饮食与运动计划请遵医嘱，并根据身体反馈及时调整。</span>
        </div>
      </div>

      <!-- 骨架屏：必须放在 #planArea 之外，否则首次自动生成方案时会被一起隐藏 -->
      <div id="planSkeleton" class="hidden">
        <div class="plan-item">
          <div class="skeleton-block" style="width:24px;height:24px;border-radius:50%"></div>
          <div style="flex:1">
            <div class="skeleton-line" style="width:40%"></div>
            <div class="skeleton-line" style="width:80%"></div>
          </div>
        </div>
        <div class="plan-item">
          <div class="skeleton-block" style="width:24px;height:24px;border-radius:50%"></div>
          <div style="flex:1">
            <div class="skeleton-line" style="width:35%"></div>
            <div class="skeleton-line" style="width:70%"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- 定制方案弹窗 -->
  <div class="modal-backdrop" id="customizeModal" role="dialog" aria-modal="true" aria-labelledby="customizeTitle">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="customizeTitle">定制生活方案</h3>
        <button class="modal-close" id="closeCustomize" aria-label="关闭">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="lifeState">当前生活习惯</label>
          <textarea class="form-textarea" id="lifeState" placeholder="例如：每天久坐 8 小时，三餐不规律，几乎不运动，晚上 12 点后入睡"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label" for="userAdvice">您的期望与建议</label>
          <textarea class="form-textarea" id="userAdvice" placeholder="例如：希望减重 5 公斤，不喜欢吃粗粮，希望运动不要太剧烈"></textarea>
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label class="form-label" for="planType">方案侧重</label>
          <select class="form-select" id="planType">
            <option value="均衡">均衡控糖</option>
            <option value="减重">减重优先</option>
            <option value="增肌">增肌优先</option>
            <option value="孕期">孕期温和</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" id="cancelCustomize">取消</button>
        <button class="btn btn-primary" id="submitCustomize">
          <span class="btn-text">生成方案</span>
          <span class="loading-spinner hidden" style="width:16px;height:16px;border-width:2px" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </div>

  <nav id="dpaBottomNav" aria-label="底部导航"></nav>

  <!-- 本地真实配置（不入库）：不存在时浏览器仅报 404，功能自动降级到本地引擎 -->
  <script src="js/config.local.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/crypto.js" defer></script>
  <script src="js/seed.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/db-client.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/mock-engine.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/charts.js" defer></script>
  <script src="js/pages/lifeplan.js" defer></script>
  <script src="js/pages/lifeplan-init.js" defer></script>
</body>
</html>
