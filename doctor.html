<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="在线医师咨询 - 获取专业糖尿病防治建议">
  <title>医师咨询 - 糖尿病预治智能助手</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <button type="button" id="dpaThemeToggle" class="theme-toggle btn btn-ghost btn-sm" aria-label="切换深色/浅色主题" title="切换主题" style="position:fixed;top:10px;right:12px;z-index:1040;width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:9999px;background:var(--bg-card);border:1px solid var(--border-color);box-shadow:var(--shadow-sm);">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="12" cy="12" r="5"/>
      <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
    </svg>
  </button>

  <nav id="dpaNavbar"></nav>

  <!-- 视图一：医生列表 -->
  <main class="page" id="listView">
    <section class="section" aria-labelledby="section-doctors">
      <div class="container">
        <div class="section-header">
          <div>
            <h2 class="section-title" id="section-doctors">在线医师</h2>
            <p class="text-muted text-sm mt-xs">选择医师，获取专业糖尿病防治建议</p>
          </div>
        </div>
        <div class="doctor-list" id="doctorList" aria-live="polite">
          <article class="doctor-card" aria-hidden="true">
            <div class="skeleton-block" style="width:56px;height:56px;border-radius:50%"></div>
            <div style="flex:1">
              <div class="skeleton-line" style="width:40%"></div>
              <div class="skeleton-line" style="width:25%"></div>
              <div class="skeleton-line" style="width:85%"></div>
            </div>
          </article>
          <article class="doctor-card" aria-hidden="true">
            <div class="skeleton-block" style="width:56px;height:56px;border-radius:50%"></div>
            <div style="flex:1">
              <div class="skeleton-line" style="width:35%"></div>
              <div class="skeleton-line" style="width:30%"></div>
              <div class="skeleton-line" style="width:80%"></div>
            </div>
          </article>
          <article class="doctor-card" aria-hidden="true">
            <div class="skeleton-block" style="width:56px;height:56px;border-radius:50%"></div>
            <div style="flex:1">
              <div class="skeleton-line" style="width:45%"></div>
              <div class="skeleton-line" style="width:28%"></div>
              <div class="skeleton-line" style="width:90%"></div>
            </div>
          </article>
        </div>

        <!-- 错误态 -->
        <div class="error-state card hidden" id="doctorError" role="alert" aria-live="assertive">
          <svg class="error-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <div class="error-state-title">医师列表加载失败</div>
          <div class="error-state-desc">无法读取医师数据，请检查本地存储或网络状态后重试。</div>
          <button class="btn btn-primary btn-sm" type="button" id="retryDoctor">重新加载</button>
        </div>
      </div>
    </section>

    <section class="section" aria-label="医疗免责声明">
      <div class="container">
        <div class="disclaimer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          <span>在线咨询基于 AI 与糖尿病知识库生成，仅供参考，不能替代线下面诊。出现紧急症状请立即就医。</span>
        </div>
      </div>
    </section>
  </main>

  <!-- 视图二：聊天 -->
  <div class="chat-page hidden" id="chatView" role="region" aria-label="医师聊天窗口">
    <header class="chat-header">
      <button class="btn btn-ghost btn-sm" id="backToList" aria-label="返回医师列表">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <div class="chat-avatar" id="chatAvatar" aria-hidden="true">医</div>
      <div class="flex-1">
        <div class="font-bold" id="chatDoctorName">医师</div>
        <div class="text-xs text-muted" id="chatDoctorDept"></div>
      </div>
      <button class="btn btn-ghost btn-sm" id="clearChat" aria-label="清空会话">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
    </header>

    <div class="chat-messages" id="chatMessages" aria-live="polite" role="log" aria-label="聊天记录"></div>
    <div class="chat-quick" id="chatQuick" aria-label="快捷问题"></div>
    <div class="chat-input-bar">
      <textarea id="chatInput" rows="1" placeholder="描述您的症状或疑问，例如：2 型糖尿病应该怎么吃？" aria-label="输入消息"></textarea>
      <button class="chat-send" id="chatSend" aria-label="发送">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

  <nav id="dpaBottomNav"></nav>

  <!-- 本地真实配置（不入库）：不存在时浏览器仅报 404，功能自动降级到本地引擎 -->
  <script src="js/config.local.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/crypto.js" defer></script>
  <script src="js/seed.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/db-client.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/mock-engine.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/pages/doctor.js" defer></script>
  <script src="js/pages/doctor-init.js" defer></script>
</body>
</html>
