<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>糖尿病预治智能助手 - AI智能助手</title>
  <link rel="stylesheet" href="css/common.css">
  <style>
    .page-content {
      padding-top: 56px;
      padding-bottom: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* 聊天容器 */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-color);
    }
    
    /* 聊天头部 */
    .chat-header {
      background: white;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      position: fixed;
      top: 56px;
      left: 0;
      right: 0;
      z-index: 10;
    }
    
    .chat-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .chat-avatar svg {
      width: 24px;
      height: 24px;
      color: white;
    }
    
    .chat-info {
      flex: 1;
    }
    
    .chat-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }
    
    .chat-status {
      font-size: 12px;
      color: var(--success-color);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .chat-status::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--success-color);
      border-radius: 50%;
    }
    
    /* 消息区域 */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 120px 16px 16px;
    }
    
    .message {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      animation: fadeIn 0.3s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .message.assistant {
      flex-direction: row;
    }
    
    .message.user {
      flex-direction: row-reverse;
    }
    
    .message-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    
    .message.assistant .message-avatar {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
    }
    
    .message.user .message-avatar {
      background: var(--primary-light);
      color: var(--primary-color);
      font-weight: 600;
      font-size: 14px;
    }
    
    .message-content {
      max-width: 75%;
    }
    
    .message-bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    
    .message.assistant .message-bubble {
      background: white;
      color: var(--text-primary);
      border-top-left-radius: 4px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }
    
    .message.user .message-bubble {
      background: var(--primary-color);
      color: white;
      border-top-right-radius: 4px;
    }
    
    .message-time {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    
    .message.user .message-time {
      text-align: right;
    }
    
    /* 打字指示器 */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 0;
    }
    
    .typing-dot {
      width: 8px;
      height: 8px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: typing 1.4s infinite;
    }
    
    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }
    
    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }
    
    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-4px); }
    }
    
    /* 快捷功能 */
    .quick-actions {
      padding: 8px 16px;
      background: white;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      flex-shrink: 0;
    }
    
    .quick-action {
      flex-shrink: 0;
      padding: 8px 14px;
      background: var(--bg-gray);
      border-radius: 16px;
      font-size: 13px;
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .quick-action:hover {
      background: var(--primary-light);
      color: var(--primary-color);
    }
    
    .quick-action svg {
      width: 16px;
      height: 16px;
    }
    
    /* 输入区域 */
    .chat-input-area {
      background: white;
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      border-top: 1px solid var(--border-color);
      flex-shrink: 0;
    }
    
    .chat-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      font-size: 14px;
      resize: none;
      max-height: 100px;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    
    .chat-input:focus {
      border-color: var(--primary-color);
    }
    
    .chat-input::placeholder {
      color: var(--text-muted);
    }
    
    .chat-send {
      width: 40px;
      height: 40px;
      background: var(--primary-color);
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    
    .chat-send:hover {
      background: var(--primary-dark);
    }
    
    .chat-send:disabled {
      background: var(--border-color);
      cursor: not-allowed;
    }
    
    .chat-send svg {
      width: 20px;
      height: 20px;
      color: white;
    }
    
    /* 导航栏样式 */
    .navbar {
      background: white;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }
    
    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 600;
      color: var(--primary-color);
      text-decoration: none;
    }
    
    .navbar-menu {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }
    
    .navbar-item {
      padding: 8px 16px;
      font-size: 14px;
      color: var(--text-secondary);
      text-decoration: none;
      border-radius: 8px;
      transition: all 0.2s;
    }
    
    .navbar-item:hover,
    .navbar-item.active {
      color: var(--primary-color);
      background: var(--primary-light);
    }
    
    /* 响应式 */
    @media (max-width: 768px) {
      .navbar-menu {
        display: none;
      }
      
      .message-content {
        max-width: 80%;
      }
    }
  </style>
</head>
<body>
  <!-- 顶部导航栏 -->
  <nav class="navbar">
    <div class="container">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <a href="home.html" class="navbar-brand">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
          </svg>
          <span>糖尿病助手</span>
        </a>
        <div class="navbar-menu">
          <a href="home.html" class="navbar-item">首页</a>
          <a href="health-news.html" class="navbar-item">健康资讯</a>
          <a href="doctor.html" class="navbar-item">医师咨询</a>
          <a href="assistant.html" class="navbar-item active">智能助手</a>
        </div>
      </div>
    </div>
  </nav>
  
  <div class="page-content">
    <div class="chat-container">
      <!-- 聊天头部 -->
      <div class="chat-header">
        <div class="chat-avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a5 5 0 0 1 5 5v3H7V7a5 5 0 0 1 5-5z"/>
            <path d="M19 10H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2z"/>
            <circle cx="9" cy="16" r="1" fill="currentColor"/>
            <circle cx="15" cy="16" r="1" fill="currentColor"/>
          </svg>
        </div>
        <div class="chat-info">
          <div class="chat-name">AI智能助手</div>
          <div class="chat-status">在线</div>
        </div>
      </div>
      
      <!-- 消息区域 -->
      <div class="chat-messages" id="chatMessages">
        <!-- 由JavaScript动态生成 -->
      </div>
      
      <!-- 快捷功能 -->
      <div class="quick-actions">
        <div class="quick-action" onclick="sendQuickQuestion('糖尿病的症状有哪些？')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 16v-4M12 8h.01"/>
          </svg>
          糖尿病症状
        </div>
        <div class="quick-action" onclick="sendQuickQuestion('糖尿病患者应该注意什么？')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 11l3 3L22 4"/>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
          注意事项
        </div>
        <div class="quick-action" onclick="sendQuickQuestion('如何控制血糖？')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
          </svg>
          血糖控制
        </div>
        <div class="quick-action" onclick="sendQuickQuestion('糖尿病有哪些类型？')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
          糖尿病类型
        </div>
      </div>
      
      <!-- 输入区域 -->
      <div class="chat-input-area">
        <textarea class="chat-input" id="chatInput" placeholder="请输入您的问题..." rows="1"></textarea>
        <button class="chat-send" id="chatSend" onclick="sendMessage()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
  
  <script>
    // 聊天消息历史
    let messages = [];
    
    // 获取当前用户
    function getCurrentUser() {
      const userStr = localStorage.getItem('diabetes_current_user') || sessionStorage.getItem('diabetes_current_user');
      return userStr ? JSON.parse(userStr) : null;
    }
    
    // 格式化时间
    function formatTime(date) {
      const hours = date.getHours().toString().padStart(2, '0');
      const minutes = date.getMinutes().toString().padStart(2, '0');
      return `${hours}:${minutes}`;
    }
    
    // 渲染消息
    function renderMessages() {
      const container = document.getElementById('chatMessages');
      const user = getCurrentUser();
      
      container.innerHTML = messages.map(msg => `
        <div class="message ${msg.type}">
          <div class="message-avatar">
            ${msg.type === 'assistant' ? `
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2a5 5 0 0 1 5 5v3H7V7a5 5 0 0 1 5-5z"/>
                <path d="M19 10H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2z"/>
              </svg>
            ` : user ? user.username.charAt(0).toUpperCase() : '我'}
          </div>
          <div class="message-content">
            <div class="message-bubble">${msg.content}</div>
            <div class="message-time">${msg.time}</div>
          </div>
        </div>
      `).join('');
      
      // 滚动到底部
      container.scrollTop = container.scrollHeight;
    }
    
    // 显示打字指示器
    function showTyping() {
      const container = document.getElementById('chatMessages');
      const typingHtml = `
        <div class="message assistant" id="typingIndicator">
          <div class="message-avatar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2a5 5 0 0 1 5 5v3H7V7a5 5 0 0 1 5-5z"/>
              <path d="M19 10H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2z"/>
            </svg>
          </div>
          <div class="message-content">
            <div class="message-bubble">
              <div class="typing-indicator">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
              </div>
            </div>
          </div>
        </div>
      `;
      container.insertAdjacentHTML('beforeend', typingHtml);
      container.scrollTop = container.scrollHeight;
    }
    
    // 隐藏打字指示器
    function hideTyping() {
      const typing = document.getElementById('typingIndicator');
      if (typing) typing.remove();
    }
    
    // 发送消息
    function sendMessage() {
      const input = document.getElementById('chatInput');
      const content = input.value.trim();
      
      if (!content) return;
      
      // 添加用户消息
      messages.push({
        type: 'user',
        content: content,
        time: formatTime(new Date())
      });
      
      renderMessages();
      
      // 清空输入框
      input.value = '';
      input.style.height = 'auto';
      
      // 禁用发送按钮
      document.getElementById('chatSend').disabled = true;
      
      // 显示打字指示器
      showTyping();
      
      // 模拟AI回复
      setTimeout(() => {
        hideTyping();
        
        const reply = generateReply(content);
        messages.push({
          type: 'assistant',
          content: reply,
          time: formatTime(new Date())
        });
        
        renderMessages();
        document.getElementById('chatSend').disabled = false;
      }, 1500);
    }
    
    // 发送快捷问题
    function sendQuickQuestion(question) {
      document.getElementById('chatInput').value = question;
      sendMessage();
    }
    
    // 生成AI回复
    function generateReply(question) {
      const replies = {
        '症状': '糖尿病的典型症状包括：\n\n1. 多饮：经常感到口渴，饮水量增加\n2. 多食：食欲增加，但体重下降\n3. 多尿：尿量增多，尤其是夜间\n4. 体重减轻：无明显原因的体重下降\n5. 疲劳乏力：容易感到疲倦\n6. 视力模糊：视力下降\n7. 伤口愈合缓慢\n\n如果您出现以上症状，建议及时就医检查血糖。',
        '注意': '糖尿病患者日常注意事项：\n\n1. 饮食管理：控制总热量，选择低GI食物，定时定量进餐\n2. 规律运动：每周至少150分钟中等强度运动\n3. 血糖监测：定期监测血糖，了解控制情况\n4. 按时用药：遵医嘱服药，不要擅自调整剂量\n5. 足部护理：每天检查足部，保持清洁干燥\n6. 定期体检：每3-6个月检查一次糖化血红蛋白\n7. 心理调适：保持积极乐观的心态',
        '血糖': '控制血糖的方法：\n\n1. 饮食控制：\n   - 选择低GI食物\n   - 控制碳水化合物摄入\n   - 增加膳食纤维\n   - 定时定量进餐\n\n2. 规律运动：\n   - 每周至少150分钟有氧运动\n   - 运动时间建议在餐后1小时\n   - 避免空腹运动\n\n3. 药物治疗：\n   - 遵医嘱按时服药\n   - 不要擅自调整剂量\n   - 注意药物副作用\n\n4. 血糖监测：\n   - 定期监测空腹和餐后血糖\n   - 记录血糖数据\n   - 及时与医生沟通',
        '类型': '糖尿病主要分为以下几种类型：\n\n1. 1型糖尿病：\n   - 胰岛素依赖型\n   - 多发于青少年\n   - 需要终身注射胰岛素\n\n2. 2型糖尿病：\n   - 最常见的类型\n   - 与生活方式密切相关\n   - 可通过饮食运动控制\n\n3. 妊娠型糖尿病：\n   - 孕期首次发现\n   - 产后多数可恢复\n   - 需密切关注\n\n4. 特殊型糖尿病：\n   - 由其他疾病或药物引起\n   - 需针对原发病治疗\n\n不同类型的糖尿病，治疗方案有所不同。建议在医生指导下进行个体化治疗。'
      };
      
      for (const [key, value] of Object.entries(replies)) {
        if (question.includes(key)) {
          return value;
        }
      }
      
      return '感谢您的提问。作为AI健康助手，我会尽力为您提供参考建议。\n\n但请注意，我的回答不能替代专业医生的诊断和治疗建议。如有健康问题，请及时就医。\n\n您可以问我关于糖尿病的症状、饮食、运动、血糖控制等方面的问题。';
    }
    
    // 输入框自动调整高度
    document.getElementById('chatInput').addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 100) + 'px';
      
      // 启用/禁用发送按钮
      document.getElementById('chatSend').disabled = !this.value.trim();
    });
    
    // 回车发送消息
    document.getElementById('chatInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (this.value.trim()) {
          sendMessage();
        }
      }
    });
    
    // 检查登录状态
    function checkLogin() {
      const user = localStorage.getItem('diabetes_current_user') || sessionStorage.getItem('diabetes_current_user');
      if (!user) {
        location.href = 'index.html';
      }
    }
    
    // 初始化
    document.addEventListener('DOMContentLoaded', () => {
      checkLogin();
      
      // 添加欢迎消息
      messages.push({
        type: 'assistant',
        content: '您好！我是糖尿病预治智能助手，很高兴为您服务。\n\n我可以为您提供以下帮助：\n1. 糖尿病相关知识咨询\n2. 饮食和运动建议\n3. 血糖控制指导\n4. 健康生活方式建议\n\n请问有什么可以帮助您的吗？',
        time: formatTime(new Date())
      });
      
      renderMessages();
    });
  </script>
</body>
</html>
