<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 智能助手 - 糖尿病预治智能助手</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <nav id="dpaNavbar"></nav>

  <!-- 视图一：功能说明 -->
  <main class="page" id="introView">
    <header class="page-header">
      <div class="container">
        <h1 class="page-title">AI 智能助手</h1>
        <p class="page-subtitle">基于 DeepSeek 大模型与糖尿病专业知识库，为您提供全流程健康服务</p>
      </div>
    </header>

    <div class="container">
      <section class="section">
        <div class="menu-list">
          <div class="menu-item">
            <div class="menu-icon blue">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            </div>
            <div class="menu-content">
              <div class="menu-title">糖尿病科普</div>
              <div class="menu-desc">分型、症状、并发症、用药等专业解答</div>
            </div>
          </div>
          <div class="menu-item">
            <div class="menu-icon green">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            </div>
            <div class="menu-content">
              <div class="menu-title">生活方案制定与修改</div>
              <div class="menu-desc">根据您的状况生成或调整饮食运动方案</div>
            </div>
          </div>
          <div class="menu-item">
            <div class="menu-icon orange">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <div class="menu-content">
              <div class="menu-title">个人健康信息管理</div>
              <div class="menu-desc">查询与更新您的健康档案与风险记录</div>
            </div>
          </div>
          <div class="menu-item">
            <div class="menu-icon purple">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"/></svg>
            </div>
            <div class="menu-content">
              <div class="menu-title">打卡分析与健康解读</div>
              <div class="menu-desc">解读您的打卡记录，给出改进建议</div>
            </div>
          </div>
        </div>
      </section>

      <button class="btn btn-primary btn-block btn-lg mb-lg" id="startChat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        开始对话
      </button>

      <div class="disclaimer mb-lg">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        <span>AI 助手提供的内容仅供健康科普与参考，不能替代专业医疗诊断。如有紧急症状请立即就医。</span>
      </div>
    </div>
  </main>

  <!-- 视图二：聊天 -->
  <div class="chat-page hidden" id="chatView">
    <header class="chat-header">
      <button class="btn btn-ghost btn-sm" id="backToIntro" aria-label="返回">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <div class="chat-avatar" style="background:linear-gradient(135deg,#2196F3,#4CAF50)">AI</div>
      <div class="flex-1">
        <div class="font-bold">糖尿病智能助手</div>
        <div class="text-xs text-muted">DeepSeek · 糖尿病知识库</div>
      </div>
      <button class="btn btn-ghost btn-sm" id="clearChat" aria-label="清空会话">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
    </header>

    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-quick" id="chatQuick"></div>
    <div class="chat-input-bar">
      <textarea id="chatInput" rows="1" placeholder="有什么可以帮您？试试问：2 型糖尿病应该怎么吃？"></textarea>
      <button class="chat-send" id="chatSend" aria-label="发送">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

  <nav id="dpaBottomNav"></nav>

  <!-- 本地真实配置（不入库）：不存在时浏览器仅报 404，功能自动降级到本地引擎 -->
  <script src="js/config.local.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/crypto.js" defer></script>
  <script src="js/seed.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/mock-engine.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/pages/assistant.js" defer></script>
</body>
</html>
