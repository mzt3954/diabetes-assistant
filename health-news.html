<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>健康资讯 - 糖尿病预治智能助手</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <nav id="dpaNavbar" class="navbar" aria-label="主导航">
    <div class="container">
      <div class="flex items-center justify-between">
        <a href="home.html" class="navbar-brand" aria-label="返回首页">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
          <span>糖尿病助手</span>
        </a>
        <button class="theme-toggle" id="dpaThemeToggle" aria-label="切换明暗主题" title="切换主题">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <main class="page">
    <header class="page-header">
      <div class="container">
        <div class="flex items-center gap-sm mb-xs">
          <span class="tag tag-purple">每日精选</span>
          <span class="text-sm text-muted">AI 个性化推荐</span>
        </div>
        <h1 class="page-title">健康资讯</h1>
        <p class="page-subtitle">基于您的健康信息，智能推荐个性化健康知识</p>
      </div>
    </header>

    <div class="container">
      <!-- 离线提示 -->
      <div id="offlineBadge" class="hidden" role="status" aria-live="polite">
        <div class="disclaimer mb-md" style="background:var(--info-soft);border-color:var(--info-light);color:var(--info-dark);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          <span>当前为离线演示模式，资讯由本地智能引擎生成。</span>
        </div>
      </div>

      <!-- 标签栏 -->
      <div class="news-tags" id="newsTags" role="tablist" aria-label="资讯分类">
        <button class="news-tag active" data-tag="全部" role="tab" aria-selected="true">全部</button>
        <button class="news-tag" data-tag="控糖饮食" role="tab" aria-selected="false">控糖饮食</button>
        <button class="news-tag" data-tag="运动健身" role="tab" aria-selected="false">运动健身</button>
        <button class="news-tag" data-tag="用药指南" role="tab" aria-selected="false">用药指南</button>
        <button class="news-tag" data-tag="并发症预防" role="tab" aria-selected="false">并发症预防</button>
      </div>

      <!-- 浏览量条形图 -->
      <div id="newsBarChart" class="mb-md"></div>

      <!-- 操作栏 -->
      <div class="flex items-center justify-between mb-md">
        <span class="text-sm text-muted" id="newsCount">共 0 篇资讯</span>
        <button class="btn btn-primary btn-sm" id="generateBtn" aria-label="生成个性化资讯">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
          <span class="btn-text">生成资讯</span>
          <span class="loading-spinner hidden" style="width:14px;height:14px;border-width:2px" aria-hidden="true"></span>
        </button>
      </div>

      <!-- 骨架屏 -->
      <div id="newsSkeleton" class="hidden">
        <div class="news-card skeleton-card" style="margin-bottom:12px">
          <div class="skeleton-block" style="width:100px;height:80px"></div>
          <div style="flex:1">
            <div class="skeleton-line" style="width:75%"></div>
            <div class="skeleton-line" style="width:90%"></div>
            <div class="skeleton-line" style="width:40%"></div>
          </div>
        </div>
        <div class="news-card skeleton-card" style="margin-bottom:12px">
          <div class="skeleton-block" style="width:100px;height:80px"></div>
          <div style="flex:1">
            <div class="skeleton-line" style="width:65%"></div>
            <div class="skeleton-line" style="width:85%"></div>
            <div class="skeleton-line" style="width:35%"></div>
          </div>
        </div>
      </div>

      <!-- 列表 -->
      <div id="newsList">
        <div class="empty-state card">
          <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 20H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v1m2 13a2 2 0 0 1-2-2V7m2 13a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2"/><line x1="7" y1="8" x2="13" y2="8"/><line x1="7" y1="12" x2="11" y2="12"/></svg>
          <div class="empty-state-title">暂无健康资讯</div>
          <div class="empty-state-desc">点击右上角「生成资讯」，AI 将为您推荐个性化健康知识。</div>
        </div>
      </div>

      <!-- 错误态 -->
      <div class="error-state card hidden" id="newsError" role="alert" aria-live="assertive">
        <svg class="error-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <div class="error-state-title">资讯加载失败</div>
        <div class="error-state-desc">无法读取文章数据，请检查本地存储或网络状态后重试。</div>
        <button class="btn btn-primary btn-sm" type="button" id="retryNews">重新加载</button>
      </div>
    </div>
  </main>

  <nav id="dpaBottomNav" aria-label="底部导航"></nav>

  <!-- 本地真实配置（不入库）：不存在时浏览器仅报 404，功能自动降级到本地引擎 -->
  <script src="js/config.local.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/crypto.js" defer></script>
  <script src="js/seed.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/db-client.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/mock-engine.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/charts.js" defer></script>
  <script src="js/pages/news.js" defer></script>
  <script src="js/pages/news-init.js" defer></script>
</body>
</html>
