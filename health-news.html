<li>接受疾病，积极面对</li>
<li>学习疾病知识，增强自我管理能力</li>
<li>寻求社会支持，与他人分享经验</li>
<li>保持积极乐观的心态</li>
<li>必要时寻求专业心理咨询</li>
</ul>`
      }
    ];
    
    let articles = [];
    let currentTag = '全部';
    let currentArticleId = null;
    
    // 获取当前用户
    function getCurrentUser() {
      const userStr = localStorage.getItem('diabetes_current_user') || sessionStorage.getItem('diabetes_current_user');
      return userStr ? JSON.parse(userStr) : null;
    }
    
    // 加载文章数据
    function loadArticles() {
      const user = getCurrentUser();
      if (!user) return;
      
      const savedArticles = localStorage.getItem('diabetes_articles');
      if (savedArticles) {
        articles = JSON.parse(savedArticles);
      } else {
        articles = [...defaultArticles];
      }
      
      renderArticles();
    }
    
    // 渲染文章列表
    function renderArticles() {
      const container = document.getElementById('articleList');
      let filteredArticles = articles;
      
      if (currentTag === '收藏') {
        filteredArticles = articles.filter(a => a.collected);
      } else if (currentTag !== '全部') {
        filteredArticles = articles.filter(a => a.category === currentTag);
      }
      
      if (filteredArticles.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="padding: 40px 0;">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
              </svg>
            </div>
            <div class="empty-title">${currentTag === '收藏' ? '暂无收藏文章' : '暂无相关文章'}</div>
            <div class="empty-desc">${currentTag === '收藏' ? '点击文章详情页的收藏按钮收藏文章' : '点击"生成健康资讯"获取个性化内容'}</div>
          </div>
        `;
        return;
      }
      
      container.innerHTML = filteredArticles.map(article => `
        <div class="article-card" onclick="openDetail(${article.id})">
          <div class="article-header">
            <div class="article-cover">
              <svg class="article-cover-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
              </svg>
            </div>
            <div class="article-info">
              <div class="article-title">${article.title}</div>
              <div class="article-excerpt">${article.excerpt}</div>
            </div>
          </div>
          <div class="article-footer">
            <div class="article-meta">
              <span class="article-meta-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
                ${article.author}
              </span>
              <span class="article-meta-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"/>
                  <polyline points="12 6 12 12 16 14"/>
                </svg>
                ${article.publishTime}
              </span>
              <span class="article-meta-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                ${article.views}
              </span>
            </div>
            <div class="article-actions">
              <div class="article-action ${article.collected ? 'collected' : ''}" onclick="event.stopPropagation(); toggleCollectItem(${article.id})">
                <svg viewBox="0 0 24 24" fill="${article.collected ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
                  <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                </svg>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }
    
    // 切换标签
    function switchTag(tag) {
      currentTag = tag;
      
      document.querySelectorAll('.tag-tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.tag === tag);
      });
      
      renderArticles();
    }
    
    // 打开文章详情
    function openDetail(articleId) {
      currentArticleId = articleId;
      const article = articles.find(a => a.id === articleId);
      if (!article) return;
      
      document.getElementById('detailTitle').textContent = article.title;
      document.getElementById('detailContent').innerHTML = article.content;
      document.getElementById('detailMeta').textContent = `${article.author} · ${article.publishTime}`;
      
      const collectBtn = document.getElementById('detailCollectBtn');
      collectBtn.textContent = article.collected ? '已收藏' : '收藏';
      collectBtn.className = article.collected ? 'btn-collect collected' : 'btn-collect';
      
      document.getElementById('detailModal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    
    // 关闭详情
    function closeDetail() {
      document.getElementById('detailModal').classList.remove('active');
      document.body.style.overflow = '';
      currentArticleId = null;
    }
    
    // 切换收藏状态（详情页）
    function toggleCollect() {
      if (!currentArticleId) return;
      toggleCollectItem(currentArticleId);
      closeDetail();
    }
    
    // 切换收藏状态（列表项）
    function toggleCollectItem(articleId) {
      const article = articles.find(a => a.id === articleId);
      if (!article) return;
      
      article.collected = !article.collected;
      saveArticles();
      renderArticles();
    }
    
    // 保存文章数据
    function saveArticles() {
      localStorage.setItem('diabetes_articles', JSON.stringify(articles));
    }
    
    // 生成文章
    function generateArticle() {
      alert('正在生成个性化健康资讯...\n\n（实际项目中将调用Dify工作流API）');
    }
    
    // 检查登录状态
    function checkLogin() {
      const user = localStorage.getItem('diabetes_current_user') || sessionStorage.getItem('diabetes_current_user');
      if (!user) {
        location.href = 'index.html';
      }
    }
    
    // 初始化
    document.addEventListener('DOMContentLoaded', () => {
      checkLogin();
      loadArticles();
    });
  </script>
</body>
</html>
