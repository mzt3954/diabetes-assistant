version: 0.6.0
kind: app
app:
  name: WF-1 首页数据管理
  description: 返回首页文章列表与糖尿病类型数据
  icon: 🏠
  icon_type: emoji
  icon_background: '#FFEAD5'
  mode: workflow
  use_icon_as_answer_icon: false
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
    nodes:
    - id: home_start
      type: custom
      data:
        type: start
        title: 开始
        variables:
        - label: 文章分类
          variable: category
          type: text-input
          required: false
          max_length: 50
      position:
        x: 40
        y: 240
      positionAbsolute:
        x: 40
        y: 240
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 110
    - id: home_llm
      type: custom
      data:
        type: llm
        title: 生成首页数据
        model:
          provider: langgenius/deepseek/deepseek
          name: deepseek-v4-flash
          mode: chat
          completion_params:
            temperature: 0.3
        prompt_template:
        - id: home_llm-system
          role: system
          text: 你是糖尿病健康知识库的数据生成器。你只输出一个 JSON 对象，绝不用三反引号包裹，绝不输出任何解释、前言或后记。
        - id: home_llm-user
          role: user
          text: '请生成「糖尿病预治智能助手」首页展示数据，严格按下面结构输出：


            {"articles":[{"article_id":1,"title":"文章标题","category":"饮食指导","author":"AI 健康助手","publish_time":"2026-01-15","views":128,"content":"正文，200字以内"}],"diabetesTypes":[{"type_id":1,"type_name":"1型糖尿病","summary":"一句话概述","pathogenesis":"发病机制","manifestation":"典型表现","treatment":"治疗要点","life_notes":["注意事项1","注意事项2","注意事项3"]}]}


            要求：

            1. articles 至少 3 条；category 只能取「饮食指导 / 运动指南 / 生活习惯 / 糖尿病科普」之一；

            2. diabetesTypes 必须恰好 4 条，type_name 依次为「1型糖尿病 / 2型糖尿病 / 妊娠型糖尿病 / 特殊型糖尿病」；

            3. 每条 life_notes 至少 3 项；

            4. publish_time 用今天的日期，格式 YYYY-MM-DD；views 为 50–500 的整数；

            5. 分类偏好（可为空，为空则不限）：{{#home_start.category#}}


            【知识库检索结果】以下内容来自糖尿病专业文档知识库，请以此为准，不要编造：

            {{#home_kb.result#}}'
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
      position:
        x: 680
        y: 240
      positionAbsolute:
        x: 680
        y: 240
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 110
    - id: home_end
      type: custom
      data:
        type: end
        title: 输出
        outputs:
        - variable: result
          value_selector:
          - home_llm
          - text
          value_type: string
      position:
        x: 1000
        y: 240
      positionAbsolute:
        x: 1000
        y: 240
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 110
    - id: home_kb
      type: custom
      data:
        type: knowledge-retrieval
        title: 知识库检索（糖尿病专业文档）
        desc: 检索 knowledge-base/ 下 6 份专业文档，为回答提供事实依据
        query_variable_selector:
        - home_start
        - category
        dataset_ids: []
        retrieval_mode: multiple
        multiple_retrieval_config:
          top_k: 4
          score_threshold: 0.5
      position:
        x: 360
        y: 240
      positionAbsolute:
        x: 360
        y: 240
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 90
    edges:
    - id: home_start-source-home_kb-target
      source: home_start
      target: home_kb
      type: custom
      data:
        sourceType: start
        targetType: knowledge-retrieval
        isInIteration: false
        isInLoop: false
      sourceHandle: source
      targetHandle: target
    - id: home_kb-source-home_llm-target
      source: home_kb
      target: home_llm
      type: custom
      data:
        sourceType: knowledge-retrieval
        targetType: llm
        isInIteration: false
        isInLoop: false
      sourceHandle: source
      targetHandle: target
    - id: home_llm-source-home_end-target
      source: home_llm
      target: home_end
      type: custom
      data:
        sourceType: llm
        targetType: end
        isInIteration: false
        isInLoop: false
      sourceHandle: source
      targetHandle: target
    viewport:
      x: 0
      y: 0
      zoom: 0.8
