version: 0.6.0
kind: app
app:
  name: AI智能助手
  description: 科普 / 信息管理 / 方案制定
  icon: 🤖
  icon_type: emoji
  icon_background: '#E4FBCC'
  mode: advanced-chat
  use_icon_as_answer_icon: false
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    opening_statement: 你好，我是本站的 AI 智能助手。可以问我糖尿病知识、网站功能怎么用，或者让我帮你调整生活方案。
    suggested_questions:
    - 风险预测怎么填？
    - 帮我调整一下早餐方案
    - 2型糖尿病能吃什么水果？
  graph:
    nodes:
    - id: chat2_start
      type: custom
      data:
        type: start
        title: 开始
        variables: []
      position:
        x: 40
        y: 240
      positionAbsolute:
        x: 40
        y: 240
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 110
    - id: chat2_llm
      type: custom
      data:
        type: llm
        title: 智能助手模型
        model:
          provider: langgenius/deepseek/deepseek
          name: deepseek-v4-flash
          mode: chat
          completion_params:
            temperature: 0.4
        prompt_template:
        - id: chat2_llm-system
          role: system
          text: '你是「糖尿病预治智能助手」网站内的 AI 智能助手，服务范围严格限定为糖尿病相关的三类任务：


            【1. 科普问答】解释糖尿病分型、指标含义、并发症、用药常识。用通俗语言，先结论后说明。

            【2. 信息管理】帮助用户理解本站功能：如何填写风险预测、如何生成生活方案、如何打卡、如何收藏文章。给出具体到页面的操作步骤。

            【3. 方案制定与修改】在用户已有生活方案的基础上做增量调整（如「早餐太单调」「想减重 5 公斤」），输出可直接执行的调整项。


            约束：

            - 不给出具体用药剂量；涉及诊疗决策时建议线下就诊；

            - 不做与糖尿病无关的闲聊，礼貌说明服务范围并引导回主题；

            - 需要用户信息时，先提问再作答，不要假设用户未提供的病情；

            - 单次回答控制在 400 字以内，必要时用短列表。'
        - id: chat2_llm-user
          role: user
          text: '{{#sys.query#}}


            【知识库检索结果】以下内容来自糖尿病专业文档知识库，请以此为准，不要编造：

            {{#chat2_kb.result#}}'
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 20
      position:
        x: 680
        y: 240
      positionAbsolute:
        x: 680
        y: 240
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 110
    - id: chat2_answer
      type: custom
      data:
        type: answer
        title: 回复
        answer: '{{#chat2_llm.text#}}'
        variables: []
      position:
        x: 1000
        y: 240
      positionAbsolute:
        x: 1000
        y: 240
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 110
    - id: chat2_kb
      type: custom
      data:
        type: knowledge-retrieval
        title: 知识库检索（糖尿病专业文档）
        desc: 检索 knowledge-base/ 下 6 份专业文档，为回答提供事实依据
        query_variable_selector:
        - sys
        - query
        dataset_ids: []
        retrieval_mode: multiple
        multiple_retrieval_config:
          top_k: 4
          score_threshold: 0.5
      position:
        x: 360
        y: 240
      positionAbsolute:
        x: 360
        y: 240
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 90
    edges:
    - id: chat2_start-source-chat2_kb-target
      source: chat2_start
      target: chat2_kb
      type: custom
      data:
        sourceType: start
        targetType: knowledge-retrieval
        isInIteration: false
        isInLoop: false
      sourceHandle: source
      targetHandle: target
    - id: chat2_kb-source-chat2_llm-target
      source: chat2_kb
      target: chat2_llm
      type: custom
      data:
        sourceType: knowledge-retrieval
        targetType: llm
        isInIteration: false
        isInLoop: false
      sourceHandle: source
      targetHandle: target
    - id: chat2_llm-source-chat2_answer-target
      source: chat2_llm
      target: chat2_answer
      type: custom
      data:
        sourceType: llm
        targetType: answer
        isInIteration: false
        isInLoop: false
      sourceHandle: source
      targetHandle: target
    viewport:
      x: 0
      y: 0
      zoom: 0.8
