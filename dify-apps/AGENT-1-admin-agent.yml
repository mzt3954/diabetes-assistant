version: "0.6.0"
kind: app
app:
  name: AI管理助手
  description: 自然语言管理网站数据
  icon: 🛠️
  icon_type: emoji
  icon_background: "#FFEAD5"
  mode: advanced-chat
  use_icon_as_answer_icon: false
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    opening_statement: 你好，我是后台管理助手。你可以用自然语言让我查统计、列用户、管理文章。
    suggested_questions:
      - 现在有多少用户和文章？
      - 列出所有文章
      - 删除 id 为 3 的文章
  graph:
    nodes:
      - id: agent_start
        type: custom
        data:
          type: start
          title: 开始
          variables: []
        position:
          x: 40
          "y": 240
        positionAbsolute:
          x: 40
          "y": 240
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 110
      - id: agent_llm
        type: custom
        data:
          type: llm
          title: 管理助手模型
          model:
            provider: langgenius/deepseek/deepseek
            name: deepseek-v4-flash
            mode: chat
            completion_params:
              temperature: 0.2
          prompt_template:
            - id: agent_llm-system
              role: system
              text: |-
                你是「糖尿病预治智能助手」的后台管理助手，用自然语言帮管理员操作网站数据。

                你能理解并回答的意图：
                1. 数据统计：用户数、文章数、打卡数、风险预测次数等；
                2. 用户管理：列出用户、查询某个用户的信息；
                3. 文章管理：列出文章、新增文章、删除文章（按 id 或标题）。

                输出要求：
                - 先用一句话复述你理解到的操作意图，再给出结果或需要管理员确认的信息；
                - 涉及删除等不可逆操作时，必须明确列出将被影响的对象，并请管理员二次确认，不得直接声称已执行；
                - 若信息不足（例如只说「删掉那篇」），必须追问具体的 id 或标题；
                - 用中文回答，简洁，控制在 300 字以内。
            - id: agent_llm-user
              role: user
              text: "{{#sys.query#}}"
          context:
            enabled: false
            variable_selector: []
          vision:
            enabled: false
          memory:
            query_prompt_template: "{{#sys.query#}}"
            role_prefix:
              assistant: ""
              user: ""
            window:
              enabled: true
              size: 20
        position:
          x: 360
          "y": 240
        positionAbsolute:
          x: 360
          "y": 240
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 110
      - id: agent_answer
        type: custom
        data:
          type: answer
          title: 回复
          answer: "{{#agent_llm.text#}}"
          variables: []
        position:
          x: 680
          "y": 240
        positionAbsolute:
          x: 680
          "y": 240
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 110
    edges:
      - id: agent_start-source-agent_llm-target
        source: agent_start
        sourceHandle: source
        target: agent_llm
        targetHandle: target
        type: custom
        data:
          sourceType: start
          targetType: llm
          isInIteration: false
          isInLoop: false
      - id: agent_llm-source-agent_answer-target
        source: agent_llm
        sourceHandle: source
        target: agent_answer
        targetHandle: target
        type: custom
        data:
          sourceType: llm
          targetType: answer
          isInIteration: false
          isInLoop: false
    viewport:
      x: 0
      "y": 0
      zoom: 0.8
