version: 0.6.0
kind: app
app:
  name: 医师咨询助手
  description: 糖尿病在线咨询（多轮对话）
  icon: 🩺
  icon_type: emoji
  icon_background: '#D1E9FF'
  mode: advanced-chat
  use_icon_as_answer_icon: false
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    opening_statement: 您好，我是糖尿病防治咨询助手。请告诉我您的年龄、糖尿病分型以及目前最关心的问题，我会结合临床指南为您解答。
    suggested_questions:
    - 2型糖尿病早餐怎么吃？
    - 空腹血糖 7.2 算高吗？
    - 餐后多久运动比较合适？
  graph:
    nodes:
    - id: chat1_start
      type: custom
      data:
        type: start
        title: 开始
        variables: []
      position:
        x: 40
        y: 240
      positionAbsolute:
        x: 40
        y: 240
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 110
    - id: chat1_llm
      type: custom
      data:
        type: llm
        title: 医师咨询模型
        model:
          provider: langgenius/deepseek/deepseek
          name: deepseek-v4-flash
          mode: chat
          completion_params:
            temperature: 0.3
        prompt_template:
        - id: chat1_llm-system
          role: system
          text: '你是一位专业的糖尿病防治医师。回答须遵循以下原则：

            1. 专业严谨：所有建议基于最新临床指南（医学营养治疗 MNT、运动疗法循证依据）

            2. 循证优先：优先推荐有 RCT 研究支持的干预措施

            3. 个体化导向：主动询问患者基本信息（年龄、分型、并发症、生活方式等）

            4. 风险提示：对胰岛素使用、低血糖处理等关键环节必须明确提示

            5. 人文关怀：使用通俗易懂语言，避免医学术语堆砌，关注患者心理状态

            6. 安全边界：不给出具体用药剂量，涉及诊疗决策时建议线下就诊


            请用中文回答，先给结论再给说明，单次回答控制在 500 字以内。'
        - id: chat1_llm-user
          role: user
          text: '{{#sys.query#}}


            【知识库检索结果】以下内容来自糖尿病专业文档知识库，请以此为准，不要编造：

            {{#chat1_kb.result#}}'
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 20
      position:
        x: 680
        y: 240
      positionAbsolute:
        x: 680
        y: 240
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 110
    - id: chat1_answer
      type: custom
      data:
        type: answer
        title: 回复
        answer: '{{#chat1_llm.text#}}'
        variables: []
      position:
        x: 1000
        y: 240
      positionAbsolute:
        x: 1000
        y: 240
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 110
    - id: chat1_kb
      type: custom
      data:
        type: knowledge-retrieval
        title: 知识库检索（糖尿病专业文档）
        desc: 检索 knowledge-base/ 下 6 份专业文档，为回答提供事实依据
        query_variable_selector:
        - sys
        - query
        dataset_ids: []
        retrieval_mode: multiple
        multiple_retrieval_config:
          top_k: 4
          score_threshold: 0.5
      position:
        x: 360
        y: 240
      positionAbsolute:
        x: 360
        y: 240
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 90
    edges:
    - id: chat1_start-source-chat1_kb-target
      source: chat1_start
      target: chat1_kb
      type: custom
      data:
        sourceType: start
        targetType: knowledge-retrieval
        isInIteration: false
        isInLoop: false
      sourceHandle: source
      targetHandle: target
    - id: chat1_kb-source-chat1_llm-target
      source: chat1_kb
      target: chat1_llm
      type: custom
      data:
        sourceType: knowledge-retrieval
        targetType: llm
        isInIteration: false
        isInLoop: false
      sourceHandle: source
      targetHandle: target
    - id: chat1_llm-source-chat1_answer-target
      source: chat1_llm
      target: chat1_answer
      type: custom
      data:
        sourceType: llm
        targetType: answer
        isInIteration: false
        isInLoop: false
      sourceHandle: source
      targetHandle: target
    viewport:
      x: 0
      y: 0
      zoom: 0.8
