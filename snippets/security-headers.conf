# snippets/security-headers.conf
# ---------------------------------------------------------------------------
# 统一安全响应头片段。被 nginx.conf 的**每一个** location 显式 include。
#
# 为什么要 include 而不是只在 server 块写一次？
#   nginx 的 add_header 不遵循"子级覆盖父级、其余继承"的直觉规则：
#   只要某个 location 内出现了**任意一条** add_header，该 location 就
#   完全不再继承父级的 add_header。原配置在静态资源/HTML 两个 location
#   里写了 Cache-Control，于是安全头在这两类响应上全部丢失。
#   把安全头放进 include 片段并在每个 location 引入，是 nginx 官方推荐的解法。
#
# 全部使用 `always`，保证 4xx/5xx 等错误响应同样携带这些头。
# ---------------------------------------------------------------------------

add_header X-Content-Type-Options    "nosniff"                                   always;
add_header X-Frame-Options           "SAMEORIGIN"                                always;
add_header Referrer-Policy           "strict-origin-when-cross-origin"           always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()"  always;

# CSP 说明：
#   script-src 'self'            项目零内联脚本，全部同源外链 → 无需 unsafe-inline
#   style-src  'self' 'unsafe-inline'
#                                页面中存在 6 处 style="" 内联样式属性，需放行内联样式
#   img-src    'self' data: blob:
#                                头像可能使用 data: URI；导出下载使用 blob:
#   connect-src 'self'           仅访问同源 /v1 反向代理；不直连外部域名
#   object-src 'none'            禁用 <object>/<embed>
#   frame-ancestors 'self'       等价于 X-Frame-Options，防点击劫持
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
