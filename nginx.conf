# 糖尿病预治智能助手 — Nginx 站点配置
# 用法：
#   1) 将本文件内容合并到 nginx.conf 的 http {} 块中，
#      或放到 conf.d/ 目录下（需确保 http 块已 include conf.d/*.conf）
#   2) 修改 root 为实际部署路径
#   3) nginx -t && nginx -s reload

server {
    listen       80;
    server_name  localhost;

    # ===== 站点根目录（改成你的实际路径）=====
    root   /var/www/diabetes-assistant;
    index  index.html;

    charset utf-8;
    access_log  logs/diabetes-assistant.access.log;
    error_log   logs/diabetes-assistant.error.log;

    # ===== 静态资源：长缓存 =====
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ===== HTML：不缓存，保证更新即时生效 =====
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ===== 主路由：未命中路径回退到 index.html =====
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== 可选：Dify 反向代理（推荐用于生产，隐藏 API Key + 解决 CORS）=====
    # 启用后，把 js/config.js 中 baseUrl 改为 'http://<本站域名>/v1'，并清空 apiKey
    #
    # location /v1/ {
    #     proxy_pass         http://127.0.0.1:8080/v1/;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   Authorization     "Bearer app-你的Dify密钥";
    #     proxy_set_header   Content-Type      "application/json";
    #
    #     # SSE 流式输出必需：关闭缓冲与缓存
    #     proxy_buffering    off;
    #     proxy_cache        off;
    #     chunked_transfer_encoding on;
    #     proxy_read_timeout 300s;
    #     proxy_send_timeout 300s;
    # }

    # ===== 基础安全响应头 =====
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # ===== Gzip 压缩 =====
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
