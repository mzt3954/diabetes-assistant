# 糖尿病预治智能助手 — Nginx 站点配置
# ---------------------------------------------------------------------------
# 用法：
#   1) 将本文件放到 conf.d/ 目录下（需确保 http 块已 include conf.d/*.conf）
#   2) 修改 root 为实际部署路径；如需 HTTPS，改 ssl_certificate 路径
#   3) nginx -t && nginx -s reload
#
# 【v2.1 修复】
#  1. add_header 继承陷阱：nginx 中只要 location 内出现了**任何** add_header，
#     父级(server/http)的 add_header 就**全部不再继承**。原配置的两个 location
#     各自定义了 Cache-Control，导致 X-Content-Type-Options / X-Frame-Options /
#     Referrer-Policy 在静态资源与 HTML 响应上静默丢失。
#     → 现在把安全头抽成 include 片段（snippets/security-headers.conf），
#       在每个 location 内显式 include，保证任何响应都带上。
#  2. 统一加 `always`，让 4xx/5xx 响应也带上安全头。
#  3. 启用 /v1/ 反向代理（密钥在代理层注入，前端不持有 Key）+ SSE 必需参数。
#  4. 新增 CSP、HSTS 与 443 站点；HTTP 站点 301 跳转到 HTTPS。
#  5. 关闭 server_tokens，隐藏 nginx 版本号。
# ---------------------------------------------------------------------------

# ===== 安全响应头片段（放在 nginx 配置目录下，或直接内联复制到各 location）=====
# 文件：snippets/security-headers.conf
#   add_header X-Content-Type-Options    "nosniff"                              always;
#   add_header X-Frame-Options           "SAMEORIGIN"                           always;
#   add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;
#   add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
#   add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

# ---------- HTTP：仅用于跳转到 HTTPS ----------
server {
    listen       80;
    server_name  localhost;
    server_tokens off;

    # 保留一个明文健康检查入口（可选，便于内网探活）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS 主站 ----------
server {
    listen       443 ssl;
    http2        on;
    server_name  localhost;
    server_tokens off;

    # ===== 证书（改成你的实际路径）=====
    ssl_certificate      /etc/nginx/certs/diabetes-assistant.crt;
    ssl_certificate_key  /etc/nginx/certs/diabetes-assistant.key;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;

    # ===== 站点根目录（改成你的实际路径）=====
    root   /var/www/diabetes-assistant;
    index  index.html;

    charset utf-8;
    access_log  logs/diabetes-assistant.access.log;
    error_log   logs/diabetes-assistant.error.log;

    client_max_body_size 2m;

    # ===== 静态资源：长缓存 =====
    # 注意：本 location 有自己的 add_header，父级安全头不会继承，
    #       因此必须在此再次 include（否则安全头在此类响应上丢失）。
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        include snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, immutable" always;
        expires 7d;
        access_log off;
    }

    # ===== HTML：不缓存，保证更新即时生效 =====
    location ~* \.html$ {
        include snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ===== Dify 反向代理（推荐用于生产：隐藏 API Key + 规避 CORS）=====
    # 启用后 js/config.js 保持 baseUrl='/v1' 且 apiKey 留空即可。
    location /v1/ {
        # 换成你的 Dify 地址；结尾带 /v1/ 以正确拼接路径
        proxy_pass         http://127.0.0.1:8080/v1/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # ===== 密钥在代理层注入，前端源码 / Network 面板均不可见 =====
        proxy_set_header   Authorization     "Bearer app-请替换为你的Dify密钥";

        # SSE 流式输出必需：关闭缓冲与缓存、保持长连接
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   Connection        "";
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        include snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ===== 主路由：未命中路径回退到 index.html =====
    location / {
        include snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }

    # ===== Gzip 压缩 =====
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}

