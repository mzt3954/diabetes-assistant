<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 智能管理 - 糖尿病预治智能助手</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <nav id="dpaNavbar" class="navbar" aria-label="主导航">
    <div class="container">
      <div class="flex items-center justify-between">
        <a href="home.html" class="navbar-brand" aria-label="返回首页">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
          <span>糖尿病助手</span>
        </a>
        <button class="theme-toggle" id="dpaThemeToggle" aria-label="切换明暗主题" title="切换主题">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <main class="page">
    <header class="page-header">
      <div class="container">
        <div class="flex items-center gap-sm mb-xs">
          <span class="tag tag-purple">管理员</span>
          <span class="text-sm text-muted">自然语言数据管理</span>
        </div>
        <h1 class="page-title">AI 智能管理</h1>
        <p class="page-subtitle">用自然语言管理平台数据，无需在多个模块间反复切换</p>
      </div>
    </header>

    <div class="container">
      <!-- 离线提示 -->
      <div id="offlineBadge" class="hidden" role="status" aria-live="polite">
        <div class="disclaimer mb-md" style="background:var(--info-soft);border-color:var(--info-light);color:var(--info-dark);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          <span>当前为离线演示模式，管理操作由本地智能引擎模拟。</span>
        </div>
      </div>

      <!-- 数据总览 -->
      <section class="section">
        <div class="section-header">
          <h2 class="section-title">数据总览</h2>
          <button class="section-more" id="exportBtn" aria-label="导出数据">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            导出数据
          </button>
        </div>

        <!-- 总览骨架屏 -->
        <div id="statsSkeleton" class="hidden">
          <div class="admin-stats">
            <div class="admin-stat"><div class="skeleton-line" style="width:60%;height:32px;margin:0 auto"></div><div class="skeleton-line" style="width:40%;height:12px;margin:8px auto 0"></div></div>
            <div class="admin-stat"><div class="skeleton-line" style="width:60%;height:32px;margin:0 auto"></div><div class="skeleton-line" style="width:40%;height:12px;margin:8px auto 0"></div></div>
            <div class="admin-stat"><div class="skeleton-line" style="width:60%;height:32px;margin:0 auto"></div><div class="skeleton-line" style="width:40%;height:12px;margin:8px auto 0"></div></div>
          </div>
        </div>

        <div class="admin-stats" id="adminStats"></div>
      </section>

      <!-- 管理助手 -->
      <section class="section">
        <div class="section-header"><h2 class="section-title">AI 管理助手</h2></div>
        <div class="admin-chat">
          <div class="admin-chat-messages" id="adminMessages" role="log" aria-live="polite" aria-label="管理助手对话">
            <div class="chat-msg bot">
              <div class="chat-avatar" style="background:var(--agent-color)" aria-hidden="true">管</div>
              <div>
                <div class="chat-bubble">您好，管理员！我可以帮您统计平台数据、查询用户列表、生成文章或管理打卡记录。请告诉我您想做什么？</div>
                <div class="chat-time">刚刚</div>
              </div>
            </div>
          </div>
          <div class="chat-quick" id="adminQuick" role="list" aria-label="快捷指令">
            <button>统计系统数据</button>
            <button>查看用户列表</button>
            <button>新增一篇文章</button>
            <button>最近打卡记录</button>
          </div>
          <div class="chat-input-bar">
            <textarea id="adminInput" rows="1" placeholder="例如：统计系统数据 / 查看用户列表 / 新增一篇文章" aria-label="输入管理指令"></textarea>
            <button class="chat-send" id="adminSend" aria-label="发送指令">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
        </div>
      </section>

      <!-- 数据表 -->
      <section class="section">
        <div class="section-header">
          <h2 class="section-title">数据表</h2>
        </div>
        <div class="filter-bar" id="tableTabs" role="tablist" aria-label="数据表分类">
          <button class="filter-chip active" data-table="users" role="tab" aria-selected="true">用户</button>
          <button class="filter-chip" data-table="articles" role="tab" aria-selected="false">文章</button>
          <button class="filter-chip" data-table="plans" role="tab" aria-selected="false">生活方案</button>
          <button class="filter-chip" data-table="punch" role="tab" aria-selected="false">打卡记录</button>
          <button class="filter-chip" data-table="risk" role="tab" aria-selected="false">风险记录</button>
        </div>

        <!-- 表格骨架屏 -->
        <div id="tableSkeleton" class="hidden">
          <div class="list">
            <div class="list-item"><div class="skeleton-line" style="width:30%"></div><div class="skeleton-line" style="width:20%"></div><div class="skeleton-line" style="width:25%"></div></div>
            <div class="list-item"><div class="skeleton-line" style="width:35%"></div><div class="skeleton-line" style="width:25%"></div><div class="skeleton-line" style="width:20%"></div></div>
            <div class="list-item"><div class="skeleton-line" style="width:28%"></div><div class="skeleton-line" style="width:30%"></div><div class="skeleton-line" style="width:22%"></div></div>
          </div>
        </div>

        <div class="list" id="tableArea">
          <div class="empty-state">
            <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <div class="empty-state-title">暂无数据</div>
            <div class="empty-state-desc">选择上方数据表分类，或向 AI 管理助手发送查询指令。</div>
          </div>
        </div>

        <!-- 错误态 -->
        <div class="error-state card hidden" id="tableError" role="alert" aria-live="assertive">
          <svg class="error-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <div class="error-state-title">数据表加载失败</div>
          <div class="error-state-desc">无法读取平台数据，请检查管理员权限或本地存储状态后重试。</div>
          <button class="btn btn-primary btn-sm" type="button" id="retryTable">重新加载</button>
        </div>
      </section>
    </div>
  </main>

  <nav id="dpaBottomNav" aria-label="底部导航"></nav>

  <!-- 本地真实配置（不入库）：不存在时浏览器仅报 404，功能自动降级到本地引擎 -->
  <script src="../js/config.local.js" defer></script>
  <script src="../js/config.js" defer></script>
  <script src="../js/crypto.js" defer></script>
  <script src="../js/seed.js" defer></script>
  <script src="../js/store.js" defer></script>
  <script src="../js/ui.js" defer></script>
  <script src="../js/auth.js" defer></script>
  <script src="../js/mock-engine.js" defer></script>
  <script src="../js/api.js" defer></script>
  <script src="../js/pages/admin.js" defer></script>
  <script>
    // 设计迭代 2：管理后台数据表错误态保护
    document.addEventListener('DOMContentLoaded', function () {
      var retry = document.getElementById('retryTable');
      if (retry) retry.addEventListener('click', function () { location.reload(); });

      var list = document.getElementById('tableArea');
      var error = document.getElementById('tableError');
      if (!list || !error) return;

      var observer = new MutationObserver(function () {
        if (list.querySelectorAll('.list-item').length > 0) error.classList.remove('show');
      });
      observer.observe(list, { childList: true });

      setTimeout(function () {
        if (list.querySelectorAll('.list-item').length === 0 && !list.querySelector('.empty-state')) {
          error.classList.add('show');
        }
      }, 3000);
    });
  </script>
</body>
</html>
