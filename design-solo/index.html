<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="糖尿病预治智能助手 - 一站式糖尿病健康管理平台">
  <title>登录 - 糖尿病预治智能助手</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <button type="button" id="dpaThemeToggle" class="theme-toggle btn btn-ghost btn-sm" aria-label="切换深色/浅色主题" title="切换主题" style="position:fixed;top:10px;right:12px;z-index:1040;width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:9999px;background:var(--bg-card);border:1px solid var(--border-color);box-shadow:var(--shadow-sm);">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="12" cy="12" r="5"/>
      <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
    </svg>
  </button>

  <div class="auth-page">
    <div class="auth-container">
      <header class="auth-header">
        <div class="auth-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
          </svg>
        </div>
        <h1 class="auth-title">糖尿病预治智能助手</h1>
        <p class="auth-subtitle">一站式糖尿病健康管理平台</p>
      </header>

      <div class="auth-card" role="region" aria-label="登录与注册">
        <div class="auth-tabs" role="tablist" aria-label="登录注册切换">
          <button class="auth-tab active" data-tab="login" role="tab" aria-selected="true" id="tab-login" aria-controls="loginForm">登录</button>
          <button class="auth-tab" data-tab="register" role="tab" aria-selected="false" id="tab-register" aria-controls="registerForm">注册</button>
        </div>

        <!-- 登录表单 -->
        <form class="auth-form active" id="loginForm" novalidate role="tabpanel" aria-labelledby="tab-login">
          <div class="form-group">
            <label class="form-label" for="loginUsername">用户名</label>
            <div class="form-input-wrapper">
              <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
              <input type="text" class="form-input" id="loginUsername" placeholder="请输入用户名" autocomplete="username" required aria-describedby="loginUsernameError">
            </div>
            <div class="form-error" id="loginUsernameError" role="alert"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="loginPassword">密码</label>
            <div class="form-input-wrapper">
              <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input type="password" class="form-input" id="loginPassword" placeholder="请输入密码" autocomplete="current-password" required aria-describedby="loginPasswordError">
              <button type="button" class="password-toggle" data-target="loginPassword" aria-label="显示或隐藏密码">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <div class="form-error" id="loginPasswordError" role="alert"></div>
          </div>

          <div class="form-group">
            <label class="form-checkbox"><input type="checkbox" id="rememberMe" checked><span>记住我</span></label>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">
            <span class="btn-text">登录</span>
            <span class="loading-spinner hidden" style="width:18px;height:18px;border-width:2px" aria-hidden="true"></span>
          </button>

          <p class="form-footer">还没有账号？<a href="#" id="goToRegister">立即注册</a></p>
        </form>

        <!-- 注册表单 -->
        <form class="auth-form" id="registerForm" novalidate role="tabpanel" aria-labelledby="tab-register">
          <div class="form-group">
            <label class="form-label" for="registerUsername">用户名</label>
            <div class="form-input-wrapper">
              <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
              <input type="text" class="form-input" id="registerUsername" placeholder="3 位以上，支持中英文/数字/下划线" autocomplete="username" required aria-describedby="registerUsernameError">
            </div>
            <div class="form-error" id="registerUsernameError" role="alert"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="registerPassword">密码</label>
            <div class="form-input-wrapper">
              <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input type="password" class="form-input" id="registerPassword" placeholder="至少 6 位" autocomplete="new-password" required aria-describedby="registerPasswordError">
              <button type="button" class="password-toggle" data-target="registerPassword" aria-label="显示或隐藏密码">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <div class="form-error" id="registerPasswordError" role="alert"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="registerConfirmPassword">确认密码</label>
            <div class="form-input-wrapper">
              <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input type="password" class="form-input" id="registerConfirmPassword" placeholder="请再次输入密码" autocomplete="new-password" required aria-describedby="registerConfirmPasswordError">
            </div>
            <div class="form-error" id="registerConfirmPasswordError" role="alert"></div>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" id="registerBtn">
            <span class="btn-text">注册</span>
            <span class="loading-spinner hidden" style="width:18px;height:18px;border-width:2px" aria-hidden="true"></span>
          </button>

          <p class="form-footer">已有账号？<a href="#" id="goToLogin">立即登录</a></p>
        </form>
      </div>

      <aside class="auth-demo" aria-label="演示账号">
        <p class="text-muted text-xs">演示账号</p>
        <div class="auth-demo-accounts">
          <button type="button" class="demo-account" data-u="admin" data-p="admin123">
            <strong>管理员</strong><span>admin / admin123</span>
          </button>
          <button type="button" class="demo-account" data-u="user" data-p="user123">
            <strong>普通用户</strong><span>user / user123</span>
          </button>
        </div>
      </aside>
    </div>
  </div>

  <!-- 本地真实配置（不入库）：不存在时浏览器仅报 404，功能自动降级到本地引擎 -->
  <script src="../js/config.local.js" defer></script>
  <script src="../js/config.js" defer></script>
  <script src="../js/crypto.js" defer></script>
  <script src="../js/seed.js" defer></script>
  <script src="../js/store.js" defer></script>
  <script src="../js/ui.js" defer></script>
  <script src="../js/auth.js" defer></script>
  <script src="../js/pages/login.js" defer></script>
</body>
</html>
