<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>糖尿病风险预测 - 糖尿病预治智能助手</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <nav id="dpaNavbar" class="navbar" aria-label="主导航">
    <div class="container">
      <div class="flex items-center justify-between">
        <a href="home.html" class="navbar-brand" aria-label="返回首页">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
          <span>糖尿病助手</span>
        </a>
        <button class="theme-toggle" id="dpaThemeToggle" aria-label="切换明暗主题" title="切换主题">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <main class="page">
    <header class="page-header">
      <div class="container">
        <div class="flex items-center gap-sm mb-xs">
          <span class="tag tag-primary">AI 评估</span>
          <span class="text-sm text-muted">基于中华医学会糖尿病风险量表</span>
        </div>
        <h1 class="page-title">糖尿病风险预测</h1>
        <p class="page-subtitle">填写个人信息，AI 将基于风险量表评估您的糖尿病风险并给出预防建议</p>
      </div>
    </header>

    <div class="container">
      <!-- 离线提示（默认隐藏，由 JS 按需显示） -->
      <div id="offlineBadge" class="hidden" role="status" aria-live="polite">
        <div class="disclaimer mb-md" style="background:var(--info-soft);border-color:var(--info-light);color:var(--info-dark);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          <span>当前为离线演示模式，评估结果由本地智能引擎生成。</span>
        </div>
      </div>

      <!-- 结果区（默认隐藏） -->
      <div id="resultArea" class="hidden" aria-live="polite"></div>

      <!-- 骨架屏（默认隐藏） -->
      <div id="riskSkeleton" class="hidden">
        <div class="risk-form-card">
          <div class="skeleton-line" style="width:30%"></div>
          <div class="form-row">
            <div class="skeleton-line" style="width:100%;height:44px"></div>
            <div class="skeleton-line" style="width:100%;height:44px"></div>
          </div>
        </div>
        <div class="risk-form-card">
          <div class="skeleton-line" style="width:30%"></div>
          <div class="form-row">
            <div class="skeleton-line" style="width:100%;height:44px"></div>
            <div class="skeleton-line" style="width:100%;height:44px"></div>
          </div>
        </div>
      </div>

      <!-- 表单区 -->
      <form id="riskForm" novalidate>
        <div class="risk-form-card">
          <h2 class="risk-section-title">基本信息</h2>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="age">年龄 <span class="required" aria-hidden="true">*</span></label>
              <input type="number" class="form-input" id="age" placeholder="请输入年龄" min="1" max="120" aria-required="true" aria-describedby="ageError">
              <div class="form-error" id="ageError" role="alert" aria-live="assertive"></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="sex">性别 <span class="required" aria-hidden="true">*</span></label>
              <select class="form-select" id="sex" aria-required="true" aria-describedby="sexError">
                <option value="">请选择</option>
                <option value="男">男</option>
                <option value="女">女</option>
              </select>
              <div class="form-error" id="sexError" role="alert" aria-live="assertive"></div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="height">身高（cm）<span class="required" aria-hidden="true">*</span></label>
              <input type="number" class="form-input" id="height" placeholder="如 170" min="80" max="250" step="0.1" aria-required="true" aria-describedby="heightError">
              <div class="form-error" id="heightError" role="alert" aria-live="assertive"></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="weight">体重（kg）<span class="required" aria-hidden="true">*</span></label>
              <input type="number" class="form-input" id="weight" placeholder="如 65" min="20" max="300" step="0.1" aria-required="true" aria-describedby="weightError">
              <div class="form-error" id="weightError" role="alert" aria-live="assertive"></div>
            </div>
          </div>

          <div class="form-group" style="margin-bottom:0">
            <label class="form-label" for="bmiDisplay">BMI（自动计算）</label>
            <input type="text" class="form-input" id="bmiDisplay" placeholder="填写身高体重后自动计算" readonly aria-live="polite">
            <p class="form-hint">BMI = 体重(kg) / 身高(m)²，用于评估体重是否超标</p>
          </div>
        </div>

        <div class="risk-form-card">
          <h2 class="risk-section-title">健康指标</h2>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="waistline">腰围（cm）</label>
              <input type="number" class="form-input" id="waistline" placeholder="如 85" min="40" max="200" step="0.1" aria-describedby="waistlineError">
              <div class="form-error" id="waistlineError" role="alert" aria-live="assertive"></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="systolicPressure">收缩压（mmHg）</label>
              <input type="number" class="form-input" id="systolicPressure" placeholder="如 120" min="60" max="260" aria-describedby="systolicPressureError">
              <div class="form-error" id="systolicPressureError" role="alert" aria-live="assertive"></div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="familyHistory">糖尿病家族史</label>
              <select class="form-select" id="familyHistory">
                <option value="无">无</option>
                <option value="有">有（父母/兄弟姐妹患病）</option>
              </select>
            </div>
            <div class="form-group" id="pregnancyGroup">
              <label class="form-label" for="isPregnancy">是否有妊娠糖尿病史</label>
              <select class="form-select" id="isPregnancy">
                <option value="无">无</option>
                <option value="有">有</option>
              </select>
            </div>
          </div>

          <div class="form-group" style="margin-bottom:0">
            <label class="form-label" for="disease">当前是否已确诊糖尿病</label>
            <select class="form-select" id="disease">
              <option value="否">否（未确诊 / 预防阶段）</option>
              <option value="是">是（已确诊）</option>
            </select>
          </div>
        </div>

        <div class="flex gap-md mb-lg">
          <button type="button" class="btn btn-outline flex-1" id="resetBtn">重置</button>
          <button type="submit" class="btn btn-primary flex-1" id="submitBtn">
            <span class="btn-text">开始评估</span>
            <span class="loading-spinner hidden" style="width:18px;height:18px;border-width:2px" aria-hidden="true"></span>
          </button>
        </div>
      </form>

      <!-- 历史评估三态容器 -->
      <section class="section" id="historySection">
        <div class="section-header">
          <h2 class="section-title">历史评估</h2>
          <span class="text-sm text-muted" id="historyCount"></span>
        </div>
        <div class="risk-form-card" id="historyList">
          <div class="empty-state">
            <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <div class="empty-state-title">暂无评估记录</div>
            <div class="empty-state-desc">完成首次评估后，历史记录将显示在这里，方便您追踪风险变化趋势。</div>
          </div>
        </div>
        <div class="risk-form-card error-state hidden" id="historyError">
          <svg class="error-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <div class="error-state-title">加载历史失败</div>
          <div class="error-state-desc">历史记录读取异常，请检查网络或本地存储状态后重试。</div>
          <button class="btn btn-primary btn-sm" id="retryHistory" type="button">重新加载</button>
        </div>
      </section>
    </div>
  </main>

  <nav id="dpaBottomNav" aria-label="底部导航"></nav>

  <!-- 本地真实配置（不入库）：不存在时浏览器仅报 404，功能自动降级到本地引擎 -->
  <script src="../js/config.local.js" defer></script>
  <script src="../js/config.js" defer></script>
  <script src="../js/crypto.js" defer></script>
  <script src="../js/seed.js" defer></script>
  <script src="../js/store.js" defer></script>
  <script src="../js/ui.js" defer></script>
  <script src="../js/auth.js" defer></script>
  <script src="../js/mock-engine.js" defer></script>
  <script src="../js/api.js" defer></script>
  <script src="../js/pages/risk.js" defer></script>
  <script>
    // 设计迭代 2：历史评估错误态重试
    document.addEventListener('DOMContentLoaded', function () {
      var retry = document.getElementById('retryHistory');
      if (retry) retry.addEventListener('click', function () { location.reload(); });
    });
  </script>
</body>
</html>
