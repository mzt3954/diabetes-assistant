<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="糖尿病健康科普文章详情">
  <title>科普文章 - 糖尿病预治智能助手</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <button type="button" id="dpaThemeToggle" class="theme-toggle btn btn-ghost btn-sm" aria-label="切换深色/浅色主题" title="切换主题" style="position:fixed;top:10px;right:12px;z-index:1040;width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:9999px;background:var(--bg-card);border:1px solid var(--border-color);box-shadow:var(--shadow-sm);">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="12" cy="12" r="5"/>
      <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
    </svg>
  </button>

  <nav id="dpaNavbar"></nav>

  <main class="page">
    <header class="article-hero">
      <div class="container">
        <h1 id="articleTitle">加载中...</h1>
        <div class="article-hero-meta" id="articleMeta" aria-live="polite">
          <span>正在获取文章信息...</span>
        </div>
      </div>
    </header>

    <div class="container">
      <article class="article-body" id="articleBody" aria-live="polite">
        <div class="loading" aria-label="文章内容加载中">
          <div class="loading-spinner" aria-hidden="true"></div>
          <div class="loading-text">正在加载文章内容...</div>
        </div>
      </article>

      <div class="article-actions">
        <button class="btn btn-outline" id="collectBtn" aria-label="收藏文章">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span id="collectText">收藏</span>
        </button>
        <button class="btn btn-outline" id="backBtn" aria-label="返回上一页">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          返回
        </button>
      </div>

      <section class="section" aria-labelledby="section-related">
        <div class="section-header">
          <h2 class="section-title" id="section-related">相关推荐</h2>
        </div>
        <div class="article-list" id="relatedList" aria-live="polite">
          <div class="skeleton-card"><div class="skeleton-block" style="width:100px;height:80px"></div><div style="flex:1"><div class="skeleton-line" style="width:80%"></div><div class="skeleton-line" style="width:50%"></div></div></div>
          <div class="skeleton-card"><div class="skeleton-block" style="width:100px;height:80px"></div><div style="flex:1"><div class="skeleton-line" style="width:75%"></div><div class="skeleton-line" style="width:55%"></div></div></div>
        </div>
      </section>
    </div>
  </main>

  <nav id="dpaBottomNav"></nav>

  <!-- 本地真实配置（不入库）：不存在时浏览器仅报 404，功能自动降级到本地引擎 -->
  <script src="../js/config.local.js" defer></script>
  <script src="../js/config.js" defer></script>
  <script src="../js/crypto.js" defer></script>
  <script src="../js/seed.js" defer></script>
  <script src="../js/store.js" defer></script>
  <script src="../js/db-client.js" defer></script>
  <script src="../js/ui.js" defer></script>
  <script src="../js/auth.js" defer></script>
  <script src="../js/pages/article.js" defer></script>
</body>
</html>
