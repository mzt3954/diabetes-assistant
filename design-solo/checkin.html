<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>打卡记录与分析 - 糖尿病预治智能助手</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <nav id="dpaNavbar" class="navbar" aria-label="主导航">
    <div class="container">
      <div class="flex items-center justify-between">
        <a href="home.html" class="navbar-brand" aria-label="返回首页">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
          <span>糖尿病助手</span>
        </a>
        <button class="theme-toggle" id="dpaThemeToggle" aria-label="切换明暗主题" title="切换主题">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <main class="page">
    <header class="page-header">
      <div class="container">
        <div class="flex items-center gap-sm mb-xs">
          <span class="tag tag-success">健康追踪</span>
          <span class="text-sm text-muted">近 7 天智能分析</span>
        </div>
        <h1 class="page-title">打卡记录与分析</h1>
        <p class="page-subtitle">记录每日健康行为，AI 智能分析近 7 天生活状态</p>
      </div>
    </header>

    <div class="container">
      <!-- 离线提示 -->
      <div id="offlineBadge" class="hidden" role="status" aria-live="polite">
        <div class="disclaimer mb-md" style="background:var(--info-soft);border-color:var(--info-light);color:var(--info-dark);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          <span>当前为离线演示模式，分析数据由本地智能引擎生成。</span>
        </div>
      </div>

      <!-- 近 7 日概览 -->
      <section class="section">
        <div class="section-header">
          <h2 class="section-title">近 7 日打卡</h2>
          <button class="section-more" id="gotoPlan" aria-label="前往生活方案打卡">
            去打卡
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>
        <div class="checkin-week" id="weekGrid" aria-label="近 7 日打卡情况">
          <!-- JS 填充 -->
        </div>
      </section>

      <!-- 近 7 日趋势折线 -->
      <section class="section" aria-label="近 7 日打卡趋势">
        <div id="trendChart"></div>
      </section>

      <!-- 智能分析 -->
      <section class="section">
        <div class="section-header">
          <h2 class="section-title">智能分析</h2>
          <button class="section-more" id="refreshAnalysis" aria-label="重新生成分析报告">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            重新分析
          </button>
        </div>

        <!-- 分析骨架屏 -->
        <div id="analysisSkeleton" class="hidden">
          <div class="analysis-card">
            <div class="analysis-metrics">
              <div class="analysis-metric-skeleton"><div class="skeleton-line" style="width:60%;height:36px;margin:0 auto"></div><div class="skeleton-line" style="width:40%;height:12px;margin:8px auto 0"></div></div>
              <div class="analysis-metric-skeleton"><div class="skeleton-line" style="width:60%;height:36px;margin:0 auto"></div><div class="skeleton-line" style="width:40%;height:12px;margin:8px auto 0"></div></div>
              <div class="analysis-metric-skeleton"><div class="skeleton-line" style="width:60%;height:36px;margin:0 auto"></div><div class="skeleton-line" style="width:40%;height:12px;margin:8px auto 0"></div></div>
            </div>
            <div class="skeleton-line" style="width:90%"></div>
            <div class="skeleton-line" style="width:75%"></div>
            <div class="skeleton-line" style="width:60%"></div>
          </div>
        </div>

        <div id="analysisArea" aria-live="polite"></div>
      </section>

      <!-- 打卡明细 -->
      <section class="section">
        <div class="section-header">
          <h2 class="section-title">打卡明细</h2>
          <span class="text-sm text-muted" id="detailCount"></span>
        </div>

        <!-- 明细骨架屏 -->
        <div id="detailSkeleton" class="hidden">
          <div class="list">
            <div class="list-item">
              <div class="skeleton-block" style="width:40px;height:40px;border-radius:50%"></div>
              <div style="flex:1">
                <div class="skeleton-line" style="width:50%"></div>
                <div class="skeleton-line" style="width:30%"></div>
              </div>
            </div>
            <div class="list-item">
              <div class="skeleton-block" style="width:40px;height:40px;border-radius:50%"></div>
              <div style="flex:1">
                <div class="skeleton-line" style="width:45%"></div>
                <div class="skeleton-line" style="width:35%"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="list" id="detailList">
          <div class="empty-state">
            <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <div class="empty-state-title">暂无打卡明细</div>
            <div class="empty-state-desc">在生活方案中完成每日计划后，打卡记录将自动同步到这里。</div>
          </div>
        </div>

        <!-- 错误态 -->
        <div class="error-state card hidden" id="detailError" role="alert" aria-live="assertive">
          <svg class="error-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <div class="error-state-title">打卡明细加载失败</div>
          <div class="error-state-desc">无法读取打卡记录，请检查本地存储状态后重试。</div>
          <button class="btn btn-primary btn-sm" type="button" id="retryDetail">重新加载</button>
        </div>
      </section>
    </div>
  </main>

  <nav id="dpaBottomNav" aria-label="底部导航"></nav>

  <!-- 本地真实配置（不入库）：不存在时浏览器仅报 404，功能自动降级到本地引擎 -->
  <script src="../js/config.local.js" defer></script>
  <script src="../js/config.js" defer></script>
  <script src="../js/crypto.js" defer></script>
  <script src="../js/seed.js" defer></script>
  <script src="../js/store.js" defer></script>
  <script src="../js/ui.js" defer></script>
  <script src="../js/auth.js" defer></script>
  <script src="../js/mock-engine.js" defer></script>
  <script src="../js/api.js" defer></script>
  <script src="js/charts.js" defer></script>
  <script src="../js/pages/checkin.js" defer></script>
  <script>
    // 设计迭代 2：近 7 日打卡趋势折线
    document.addEventListener('DOMContentLoaded', function () {
      if (!window.DPA || !DPA.store || !DPA.charts) return;
      var WEEK_CN = ['日', '一', '二', '三', '四', '五', '六'];
      var today = DPA.store.dateKey(new Date());
      var recent = DPA.store.punch.recentDays(7);
      var data = recent.map(function (d) {
        var count = d.items.filter(function (p) { return p.completion_status === '已完成'; }).length;
        var dateObj = new Date(d.date);
        var label = (d.date === today ? '今天' : '周' + WEEK_CN[dateObj.getDay()]);
        return { label: label, value: count };
      });
      DPA.charts.trendLine('#trendChart', data, { title: '近 7 日打卡趋势' });

      // 打卡明细错误态保护
      var retryDetail = document.getElementById('retryDetail');
      if (retryDetail) retryDetail.addEventListener('click', function () { location.reload(); });
      var detailList = document.getElementById('detailList');
      var detailError = document.getElementById('detailError');
      if (detailList && detailError) {
        var detailObserver = new MutationObserver(function () {
          if (detailList.querySelectorAll('.list-item').length > 0) detailError.classList.remove('show');
        });
        detailObserver.observe(detailList, { childList: true });
        setTimeout(function () {
          if (detailList.querySelectorAll('.list-item').length === 0 && !detailList.querySelector('.empty-state')) {
            detailError.classList.add('show');
          }
        }, 3000);
      }
    });
  </script>
</body>
</html>
